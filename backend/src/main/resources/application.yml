server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: secondhand-shared
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/secondhand_db?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:12345}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
  # Redis 配置
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DB:0}
      timeout: 3s
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 2
          max-wait: 2s

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.campus.secondhand.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# JWT 配置
jwt:
  secret: ${JWT_SECRET:campus-secondhand-jwt-secret-key-2024-very-long-string}
  expiration: 86400000

# CORS 配置：默认允许任意源（局域网/内网穿透访问），生产用环境变量收紧为精确域名
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:*}

# 文件上传配置
# ⚠️ 该路径为相对路径，解析依赖于 JVM 工作目录（working directory）
# - 在 IntelliJ 中运行：默认工作目录为 backend/ 模块目录，路径解析为 backend/uploads/
# - 生产部署建议使用绝对路径，如：D:/app/uploads/ 或 /var/app/uploads/
# 启动日志会输出实际解析后的绝对路径，可用于调试
file:
  upload-path: ./uploads/

# 支付配置（支付宝沙箱）
# 凭据从支付宝开放平台沙箱控制台领取：https://open.alipay.com/develop/sandbox/app
# 三个值留空 = 未配置，前端支付宝选项提示不可用，微信模拟支付不受影响
pay:
  alipay:
    app-id: ${ALIPAY_APP_ID:9021000167647999}
    private-key: ${ALIPAY_PRIVATE_KEY:}
    alipay-public-key: ${ALIPAY_PUBLIC_KEY:}
    gateway: ${ALIPAY_GATEWAY:https://openapi-sandbox.dl.alipaydev.com/gateway.do}
    notify-url: ${ALIPAY_NOTIFY_URL:http://localhost:8080/api/pay/alipay/notify}