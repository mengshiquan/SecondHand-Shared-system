server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: secondhand-shared
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/secondhand_db?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: 12345
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.campus.secondhand.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# JWT 配置
jwt:
  secret: campus-secondhand-jwt-secret-key-2024-very-long-string
  expiration: 86400000

# 文件上传配置
# ⚠️ 该路径为相对路径，解析依赖于 JVM 工作目录（working directory）
# - 在 IntelliJ 中运行：默认工作目录为 backend/ 模块目录，路径解析为 backend/uploads/
# - 生产部署建议使用绝对路径，如：D:/app/uploads/ 或 /var/app/uploads/
# 启动日志会输出实际解析后的绝对路径，可用于调试
file:
  upload-path: ./uploads/