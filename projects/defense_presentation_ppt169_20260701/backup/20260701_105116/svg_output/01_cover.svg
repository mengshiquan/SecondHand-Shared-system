<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#FFFFFF"/>
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E3F2FD"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
    <linearGradient id="titleGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1565C0"/>
      <stop offset="100%" stop-color="#1976D2"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1280" height="720" fill="url(#bgGradient)"/>
  <rect x="0" y="0" width="1280" height="100" fill="#1565C0" fill-opacity="0.05"/>
  <rect x="0" y="620" width="1280" height="100" fill="#1565C0" fill-opacity="0.05"/>
  <circle cx="1100" cy="120" r="150" fill="#1565C0" fill-opacity="0.05"/>
  <circle cx="180" cy="600" r="120" fill="#1976D2" fill-opacity="0.05"/>
  <polygon points="640,150 670,180 610,180" fill="#1565C0"/>
  <polygon points="640,550 670,520 610,520" fill="#1565C0" fill-opacity="0.5"/>
  <rect x="200" y="250" width="880" height="4" fill="#E2E8F0"/>
  <text x="640" y="280" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="96" font-weight="bold" fill="url(#titleGradient)">校园二手物品共享平台</text>
  <text x="640" y="330" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="36" fill="#64748B">SecondHand-Shared System</text>
  <text x="640" y="350" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="36" fill="#64748B">的设计与实现</text>
  <rect x="440" y="420" width="400" height="3" fill="#1565C0" fill-opacity="0.3"/>
  <text x="640" y="470" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="32" fill="#1E293B">答辩人：XXX</text>
  <text x="640" y="510" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="32" fill="#1E293B">指导老师：XXX</text>
  <text x="640" y="550" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="32" fill="#1E293B">答辩时间：2026年7月</text>
  <text x="1200" y="700" text-anchor="end" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="19" fill="#94A3B8">1/10</text>
</svg>