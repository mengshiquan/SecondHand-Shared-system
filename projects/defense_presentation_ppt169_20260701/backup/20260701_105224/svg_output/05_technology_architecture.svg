<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#FFFFFF"/>
  <rect x="0" y="0" width="1280" height="80" fill="#F8FAFC"/>
  <text x="640" y="55" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="56" font-weight="bold" fill="#1E293B">系统技术架构</text>
  <rect x="60" y="100" width="1160" height="4" fill="#1565C0"/>
  <rect x="60" y="140" width="1160" height="140" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="640" y="190" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="40" font-weight="bold" fill="#1E293B">三层架构</text>
  <rect x="120" y="220" width="340" height="50" rx="8" fill="#1565C0"/>
  <text x="290" y="255" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="28" font-weight="bold" fill="#FFFFFF">前端层</text>
  <text x="290" y="275" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="22" fill="#64748B">Vue 3 + Element Plus + Vite</text>
  <rect x="480" y="220" width="340" height="50" rx="8" fill="#1976D2"/>
  <text x="650" y="255" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="28" font-weight="bold" fill="#FFFFFF">后端层</text>
  <text x="650" y="275" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="22" fill="#64748B">Spring Boot + MyBatis-Plus + JWT</text>
  <rect x="840" y="220" width="340" height="50" rx="8" fill="#0D47A1"/>
  <text x="1010" y="255" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="28" font-weight="bold" fill="#FFFFFF">数据层</text>
  <text x="1010" y="275" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="22" fill="#64748B">MySQL 8.0</text>
  <line x1="290" y1="280" x2="650" y2="300" stroke="#1565C0" stroke-width="2" stroke-dasharray="5,5"/>
  <line x1="650" y1="280" x2="1010" y2="300" stroke="#1565C0" stroke-width="2" stroke-dasharray="5,5"/>
  <rect x="60" y="300" width="560" height="240" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <rect x="60" y="300" width="12" height="56" fill="#1565C0"/>
  <text x="90" y="340" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="40" font-weight="bold" fill="#1E293B">后端分层架构</text>
  <rect x="90" y="370" width="480" height="40" rx="6" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="330" y="398" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="28" font-weight="bold" fill="#1565C0">Controller（控制层）</text>
  <text x="480" y="398" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="22" fill="#64748B">接收HTTP请求，参数校验，调用Service</text>
  <polygon points="330,410 340,420 320,420" fill="#1565C0"/>
  <rect x="90" y="420" width="480" height="40" rx="6" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="330" y="448" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="28" font-weight="bold" fill="#1565C0">Service（业务逻辑层）</text>
  <text x="480" y="448" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="22" fill="#64748B">业务规则、权限校验、数据转换</text>
  <polygon points="330,460 340,470 320,470" fill="#1565C0"/>
  <rect x="90" y="470" width="480" height="40" rx="6" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="330" y="498" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="28" font-weight="bold" fill="#1565C0">Mapper（数据访问层）</text>
  <text x="480" y="498" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="22" fill="#64748B">MyBatis-Plus内置CRUD，复杂查询XML</text>
  <polygon points="330,510 340,520 320,520" fill="#1565C0"/>
  <rect x="90" y="520" width="480" height="40" rx="6" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="330" y="548" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="28" font-weight="bold" fill="#1565C0">Entity（实体层）</text>
  <text x="480" y="548" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="22" fill="#64748B">数据库表映射，软删除支持</text>
  <rect x="640" y="300" width="580" height="240" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <rect x="640" y="300" width="12" height="56" fill="#1976D2"/>
  <text x="670" y="340" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="40" font-weight="bold" fill="#1E293B">前端分层架构</text>
  <rect x="670" y="370" width="510" height="36" rx="6" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="925" y="395" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="26" font-weight="bold" fill="#1976D2">Views（页面组件）</text>
  <polygon points="925,406 935,416 915,416" fill="#1976D2"/>
  <rect x="670" y="416" width="510" height="36" rx="6" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="925" y="441" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="26" font-weight="bold" fill="#1976D2">Components（通用组件）</text>
  <polygon points="925,452 935,462 915,462" fill="#1976D2"/>
  <rect x="670" y="462" width="510" height="36" rx="6" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="925" y="487" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="26" font-weight="bold" fill="#1976D2">API Modules（接口模块）</text>
  <polygon points="925,498 935,508 915,508" fill="#1976D2"/>
  <rect x="670" y="508" width="510" height="36" rx="6" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="925" y="533" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="26" font-weight="bold" fill="#1976D2">Utils + Stores（工具与状态）</text>
  <text x="1200" y="700" text-anchor="end" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="19" fill="#94A3B8">5/10</text>
</svg>