<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#FFFFFF"/>
  <rect x="0" y="0" width="1280" height="80" fill="#F8FAFC"/>
  <text x="640" y="55" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="56" font-weight="bold" fill="#1E293B">数据库设计</text>
  <rect x="60" y="100" width="1160" height="4" fill="#1565C0"/>
  <rect x="60" y="140" width="1160" height="80" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="90" y="180" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="32" font-weight="bold" fill="#1E293B">数据库信息：</text>
  <text x="250" y="180" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="32" fill="#64748B">数据库名：secondhand_db</text>
  <text x="550" y="180" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="32" fill="#64748B">存储引擎：InnoDB</text>
  <text x="800" y="180" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="32" fill="#64748B">字符集：utf8mb4</text>
  <rect x="60" y="240" width="360" height="220" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <rect x="60" y="240" width="12" height="56" fill="#1565C0"/>
  <text x="90" y="280" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="36" font-weight="bold" fill="#1E293B">t_user</text>
  <text x="90" y="320" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="26" fill="#64748B">• id, username, password</text>
  <text x="90" y="350" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="26" fill="#64748B">• nickname, avatar, phone</text>
  <text x="90" y="380" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="26" fill="#64748B">• email, role, status</text>
  <text x="90" y="410" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="26" fill="#64748B">• create_time, update_time</text>
  <rect x="440" y="240" width="360" height="220" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <rect x="440" y="240" width="12" height="56" fill="#1976D2"/>
  <text x="470" y="280" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="36" font-weight="bold" fill="#1E293B">t_product</text>
  <text x="470" y="320" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="26" fill="#64748B">• id, title, description</text>
  <text x="470" y="350" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="26" fill="#64748B">• price, original_price</text>
  <text x="470" y="380" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="26" fill="#64748B">• images, category_id, user_id</text>
  <text x="470" y="410" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="26" fill="#64748B">• status, view_count</text>
  <rect x="820" y="240" width="360" height="220" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <rect x="820" y="240" width="12" height="56" fill="#0D47A1"/>
  <text x="850" y="280" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="36" font-weight="bold" fill="#1E293B">t_order</text>
  <text x="850" y="320" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="26" fill="#64748B">• id, order_no, product_id</text>
  <text x="850" y="350" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="26" fill="#64748B">• buyer_id, seller_id</text>
  <text x="850" y="380" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="26" fill="#64748B">• price, status</text>
  <text x="850" y="410" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="26" fill="#64748B">• remark, create_time</text>
  <line x1="240" y1="460" x2="620" y2="460" stroke="#1565C0" stroke-width="2" stroke-dasharray="5,5"/>
  <line x1="620" y1="460" x2="1000" y2="460" stroke="#1565C0" stroke-width="2" stroke-dasharray="5,5"/>
  <text x="430" y="475" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="22" fill="#1565C0">一对多</text>
  <text x="810" y="475" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="22" fill="#1565C0">一对多</text>
  <rect x="60" y="480" width="260" height="100" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="190" y="515" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="28" font-weight="bold" fill="#1E293B">t_category</text>
  <text x="190" y="545" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="22" fill="#64748B">分类表：id, name, parent_id, icon</text>
  <rect x="340" y="480" width="260" height="100" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="470" y="515" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="28" font-weight="bold" fill="#1E293B">t_favorite</text>
  <text x="470" y="545" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="22" fill="#64748B">收藏表：id, user_id, product_id</text>
  <rect x="620" y="480" width="260" height="100" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="750" y="515" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="28" font-weight="bold" fill="#1E293B">t_comment</text>
  <text x="750" y="545" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="22" fill="#64748B">评论表：id, product_id, user_id, content, rating</text>
  <rect x="900" y="480" width="340" height="100" rx="8" fill="#E3F2FD" stroke="#1565C0" stroke-width="1"/>
  <text x="1070" y="515" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="28" font-weight="bold" fill="#1565C0">逻辑删除</text>
  <text x="1070" y="545" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="22" fill="#64748B">所有表包含deleted字段（0=正常，1=已删除）</text>
  <text x="1200" y="700" text-anchor="end" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="19" fill="#94A3B8">8/10</text>
</svg>