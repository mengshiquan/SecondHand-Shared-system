<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#FFFFFF"/>
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E3F2FD"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
    <linearGradient id="titleGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1565C0"/>
      <stop offset="100%" stop-color="#1976D2"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#bgGradient)"/>
  <rect x="0" y="0" width="1280" height="80" fill="#F8FAFC"/>
  <text x="640" y="55" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="56" font-weight="bold" fill="url(#titleGradient)">总结与展望</text>
  <rect x="60" y="100" width="1160" height="4" fill="#1565C0"/>
  <rect x="60" y="140" width="1160" height="200" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <rect x="60" y="140" width="12" height="56" fill="#10B981"/>
  <text x="90" y="180" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="40" font-weight="bold" fill="#1E293B">项目总结</text>
  <text x="90" y="220" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="32" fill="#64748B">• 完成了校园二手物品共享平台的需求分析</text>
  <text x="90" y="255" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="32" fill="#64748B">• 设计了前后端分离的系统架构</text>
  <text x="90" y="290" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="32" fill="#64748B">• 实现了用户认证、商品管理、订单流转、收藏评论等核心功能</text>
  <text x="90" y="325" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="32" fill="#64748B">• 建立了统一的数据返回格式与全局异常处理机制</text>
  <text x="90" y="360" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="32" fill="#64748B">• 设计了品牌化的视觉规范，实现了响应式布局</text>
  <rect x="60" y="360" width="1160" height="220" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <rect x="60" y="360" width="12" height="56" fill="#F59E0B"/>
  <text x="90" y="400" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="40" font-weight="bold" fill="#1E293B">后续改进方向</text>
  <rect x="90" y="430" width="260" height="60" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="220" y="465" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="24" font-weight="bold" fill="#1565C0">实时消息推送</text>
  <text x="220" y="485" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="20" fill="#64748B">WebSocket实现</text>
  <rect x="370" y="430" width="260" height="60" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="500" y="465" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="24" font-weight="bold" fill="#1565C0">全文检索</text>
  <text x="500" y="485" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="20" fill="#64748B">Elasticsearch</text>
  <rect x="650" y="430" width="260" height="60" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="780" y="465" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="24" font-weight="bold" fill="#1565C0">第三方支付</text>
  <text x="780" y="485" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="20" fill="#64748B">微信/支付宝</text>
  <rect x="930" y="430" width="260" height="60" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="1060" y="465" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="24" font-weight="bold" fill="#1565C0">智能推荐</text>
  <text x="1060" y="485" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="20" fill="#64748B">协同过滤算法</text>
  <rect x="90" y="510" width="520" height="60" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="350" y="545" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="24" font-weight="bold" fill="#1565C0">容器化部署</text>
  <text x="350" y="565" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="20" fill="#64748B">Docker + docker-compose</text>
  <rect x="630" y="510" width="520" height="60" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="890" y="545" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="24" font-weight="bold" fill="#1565C0">在线聊天</text>
  <text x="890" y="565" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="20" fill="#64748B">买卖双方即时沟通</text>
  <rect x="60" y="590" width="1160" height="100" rx="12" fill="#E3F2FD" stroke="#1565C0" stroke-width="2"/>
  <text x="640" y="630" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="40" font-weight="bold" fill="#1565C0">致谢</text>
  <text x="640" y="665" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="32" fill="#1E293B">感谢导师的悉心指导</text>
  <text x="640" y="690" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="32" fill="#1E293B">感谢答辩委员会的评审</text>
  <text x="1200" y="700" text-anchor="end" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="19" fill="#94A3B8">10/10</text>
</svg>